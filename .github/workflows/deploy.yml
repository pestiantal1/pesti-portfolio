name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # This ensures write permissions
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: 'pestiantal-portfolio/package-lock.json'

      - name: Install dependencies
        working-directory: ./pestiantal-portfolio
        run: npm ci

      - name: Build
        working-directory: ./pestiantal-portfolio
        run: npm run build

      - name: Create .nojekyll file
        run: touch ./pestiantal-portfolio/out/.nojekyll

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: pestiantal-portfolio/out
          branch: gh-pages
          clean: true  # Removes files that are no longer needed
